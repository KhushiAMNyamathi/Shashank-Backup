path: /home/adminusr/Shashank/DEMO
seed_initialization: 42
experiment_name: 3dgut_mcmc
resume: ''
out_dir: /home/adminusr/Shashank/results
n_iterations: 30000
with_gui: false
with_viser_gui: false
gui_update_from_device: true
val_frequency: 999999
num_workers: 24
use_wandb: false
wandb_project: 3dgrt
test_last: true
validate_first: false
log_frequency: 1
compute_extra_metrics: true
enable_frame_timings: false
enable_writer: true
writer:
  hit_stat_frequency: 999999
  max_num_hits: 128
  log_image_views: ${int_list:[ 0, 13, 27, 43, 78 ]}
export_ply:
  enabled: true
  path: ''
import_ply:
  enabled: false
  path: ''
  init_global_step: 0
export_usd:
  enabled: true
  path: ''
  apply_normalizing_transform: true
  format: standard
  half_precision: false
  export_cameras: true
  export_background: true
  sorting_mode_hint: cameraDistance
  export_post_processing: true
  ppisp-integration-mode: spg-runtime
  ppisp-reference-camera-id: null
  ppisp-reference-frame-id: null
  ppisp-responsivity: 1.0
  enable-ppisp-controller-export: null
  sh-optimization-num-iterations: null
  scene-radiance-scale: 1.0
  frames_per_second: 1.0
model:
  density_activation: sigmoid
  scale_activation: exp
  default_density: 0.5
  default_scale_factor: 0.1
  optimize_density: true
  optimize_features_albedo: true
  optimize_features_specular: true
  optimize_features: true
  optimize_position: true
  optimize_rotation: true
  optimize_scale: true
  bvh_update_frequency: 1
  feature_type: sh
  progressive_training:
    init_n_features: 0
    max_n_features: 3
    increase_frequency: 1000
    increase_step: 1
  nht_features:
    dim: 48
    init_min: -1.5707963267948966
    init_max: 1.5707963267948966
    activation:
      type: sincos
      num_frequencies: 1
    interpolation_type: barycentric
  nht_decoder:
    enabled: true
    hidden_dim: 128
    num_layers: 3
    dir_encoding: SphericalHarmonics
    dir_encoding_degree: 3
    sh_scale: 3.0
    center_ray_encoding: false
    output_activation: Sigmoid
    unpremultiply_alpha: false
    learning_rate: 0.00068
    reg_weight: 0.0
    scheduler:
      type: cosine
      decay_final: 0.1
      max_steps: 30000
    ema_decay: 0.95
    ema_start_step: 0
    color_refine_steps: 3000
  background:
    name: background-color
    color: black
  print_stats: true
checkpoint:
  iterations: ${int_list:[ 7000, 30000 ]}
optimizer:
  type: adam
  lr: 0.0
  eps: 1.0e-15
  params:
    positions:
      lr: 0.00016
    density:
      lr: 0.05
    features_albedo:
      lr: 0.0025
    features_specular:
      lr: ${div:${optimizer.params.features_albedo.lr},20}
    features:
      lr: 0.015
    rotation:
      lr: 0.001
    scale:
      lr: 0.005
scheduler:
  positions:
    type: exp
    lr_init: ${optimizer.params.positions.lr}
    lr_final: 1.6e-06
    max_steps: 30000
  density:
    type: skip
  features:
    type: cosine
    decay_final: 0.1
    max_steps: 30000
loss:
  use_l1: true
  lambda_l1: 0.8
  use_l2: false
  lambda_l2: 1.0
  use_ssim: true
  lambda_ssim: 0.2
  use_opacity: true
  lambda_opacity: 0.01
  use_scale: true
  lambda_scale: 0.01
post_processing:
  method: null
  use_controller: true
  n_distillation_steps: 5000
strategy:
  method: MCMCStrategy
  print_stats: true
  binom_n_max: 51
  opacity_threshold: 0.005
  relocate:
    start_iteration: 500
    end_iteration: 25000
    frequency: 100
  perturb:
    start_iteration: 0
    end_iteration: 27500
    frequency: 1
    noise_lr: 500000.0
  add:
    start_iteration: 500
    end_iteration: 25000
    frequency: 100
    max_n_gaussians: 1000000
dataset:
  type: colmap
  downsample_factor: 1
  test_split_interval: 8
  normalize_world_space: false
  gsplat_image_downscale: false
  camera_names: null
  camera_ids: null
  load_exif: true
initialization:
  method: colmap
  observation_scale_factor: 0.01
  use_observation_points: false
render:
  method: 3dgut
  pipeline_type: reference
  backward_pipeline_type: ${render.pipeline_type}Bwd
  particle_kernel_degree: 2
  particle_kernel_density_clamping: true
  particle_kernel_min_response: 0.0113
  particle_kernel_min_alpha: ${div:1.0,255.0}
  particle_kernel_max_alpha: 0.99
  particle_radiance_sph_degree: 3
  primitive_type: instances
  min_transmittance: 0.0001
  max_consecutive_bvh_update: 15
  enable_normals: false
  enable_hitcounts: true
  enable_kernel_timings: false
  particle_feature_half: false
  feature_output_half: false
  splat:
    rect_bounding: true
    tight_opacity_bounding: true
    tile_based_culling: true
    n_rolling_shutter_iterations: 5
    ut_alpha: 1.0
    ut_beta: 2.0
    ut_kappa: 0.0
    ut_in_image_margin_factor: 0.1
    ut_require_all_sigma_points_valid: false
    k_buffer_size: 0
    global_z_order: true
    fine_grained_load_balancing: false
